name: Lean assurance POC
on:
  push:
    branches: [poc/lean4-assurance]
  pull_request:
    paths:
      - 'formal/lean4/**'
      - 'src/assurance.rs'
      - 'src/explore.rs'
      - 'src/model.rs'
      - '.github/workflows/lean-assurance.yml'
permissions:
  contents: read
concurrency:
  group: lean-assurance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean version manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check kernel proofs
        working-directory: formal/lean4
        run: lake build
