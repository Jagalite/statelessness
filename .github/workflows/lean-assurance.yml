name: Lean assurance POC
on:
  push:
    branches: [poc/lean4-assurance]
  pull_request:
    paths:
      - 'formal/lean4/**'
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/lean-assurance.yml'
permissions:
  contents: read
concurrency:
  group: lean-assurance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs-and-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.90.0
      - name: Install Lean version manager
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Existing Rust workspace tests
        run: cargo test --offline --workspace
      - name: Kernel proofs, axiom audit, conformance and mutation controls
        run: python3 formal/lean4/check.py --mutations
      - name: Retain verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-assurance-receipts
          path: formal/lean4/results/
          if-no-files-found: ignore
