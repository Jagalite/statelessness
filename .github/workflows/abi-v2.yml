name: ABI v2 compile and package inspection

# Manual by design. These jobs compile and inspect; they do not execute an
# engine, run model tests, measure performance, publish, or switch any default.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate packaging logic without loading an engine
        run: |
          python scripts/test_readiness.py
          python scripts/test_binding_evidence.py

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.90.0', stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicit toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Compile workspace tests without executing them
        run: cargo +${{ matrix.rust }} test --locked --offline --workspace --no-run
      - name: Build additive distributions and inspect actual bytes
        run: |
          python scripts/build-bindings.py --kind native --abi-v2 --toolchain ${{ matrix.rust }}
          python scripts/check-abi-v2-package.py --package target/bindings/native --mode inspect --source-root . --report target/abi-v2/native-inspection.json
      - name: Build Python wheel without importing its engine
        run: |
          python -m pip install 'setuptools>=77' wheel
          python -m pip wheel --no-build-isolation --no-deps target/bindings/python --wheel-dir target/bindings/python-dist
      - name: Compile relocated Swift v2 package and fixture tests
        if: runner.os == 'macOS'
        run: swift build --build-tests --package-path target/bindings/swift-v2 -Xlinker -L"$PWD/target/bindings/native/lib"
      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version: '1.24'
          cache: false
      - name: Compile relocated Go v2 fixtures without executing them
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: '1'
        run: |
          export CGO_LDFLAGS="-L$PWD/target/bindings/native/lib"
          mkdir -p target/abi-v2/go
          go -C target/bindings/go-v2 test -c -o "$PWD/target/abi-v2/go/v2.test" ./v2
          go -C target/bindings/go-v2 test -c -o "$PWD/target/abi-v2/go/packet.test" ./v2/internal/portablejson
          go -C target/bindings/go-v2 test -c -o "$PWD/target/abi-v2/go/conformance.test" ./v2/conformance
          go -C target/bindings/go-v2 build -o "$PWD/target/abi-v2/go/corpus" ./v2/cmd/stateless-corpus
      - name: Preserve source identity
        if: always()
        run: |
          mkdir -p target/abi-v2
          git archive --format=tar.gz HEAD -o target/abi-v2/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-v2-compile-package-${{ matrix.os }}-${{ matrix.rust }}
          path: |
            target/bindings/
            target/abi-v2/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install explicit Wasm toolchain and declaration compiler
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          npm ci --prefix typescript --ignore-scripts --no-audit --no-fund
      - name: Compile, package and inspect without instantiating Wasm
        run: |
          python scripts/build-bindings.py --kind browser --abi-v2 --toolchain 1.90.0
          node --check target/bindings/browser/v2.mjs
          typescript/node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext target/bindings/browser/v2.d.ts
          python scripts/check-abi-v2-package.py --package target/bindings/browser --mode inspect --source-root . --report target/abi-v2/browser-inspection.json
          mkdir -p target/bindings/browser-dist
          npm pack ./target/bindings/browser --ignore-scripts --offline --pack-destination target/bindings/browser-dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abi-v2-wasm-compile-package
          path: |
            target/bindings/
            target/abi-v2/
          retention-days: 14
