name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  qualification:
    if: github.repository == 'Jagalite/statelessness' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/verify.yml
    with:
      profile: full

  publish:
    needs: qualification
    if: github.repository == 'Jagalite/statelessness' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          assert os.environ["RELEASE_TAG"] == "v" + package["version"], "Tag must match package version"
          PYTHON
      - name: Install Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - name: Verify registry packages
        run: |
          cargo publish -p statelessness --locked --dry-run
          cargo publish -p statelessness-macros --locked --dry-run
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish
        run: cargo publish -p statelessness --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
