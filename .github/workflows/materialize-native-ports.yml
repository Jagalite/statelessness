name: Materialize tested native ports

on:
  push:
    branches: [codex/native-go-typescript-swift]
    paths:
      - '.native-ports-bootstrap/**'
      - '.github/workflows/materialize-native-ports.yml'

permissions:
  contents: write

jobs:
  source:
    if: github.repository == 'Jagalite/statelessness' && github.ref == 'refs/heads/codex/native-go-typescript-swift'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify and materialize exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          data = b''.join(pathlib.Path(f'.native-ports-bootstrap/part-{i}').read_bytes() for i in range(1,6))
          assert len(data) == 56528
          assert hashlib.sha256(data).hexdigest() == '78847b2c6a2fa0909da03e94e330d85f2b1b29afb926beae1800f8bed755ae37'
          patch = lzma.decompress(data)
          assert len(patch) == 251481
          pathlib.Path('/tmp/native-ports.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/native-ports.patch
          git apply --index /tmp/native-ports.patch
          # The connector will add the permanent workflow and remove this one.
          # This bot commit changes no workflow permissions or workflow contents.
          git reset HEAD -- .github/workflows/native-ports.yml
          rm .github/workflows/native-ports.yml
          git rm -r .native-ports-bootstrap
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          # Verify the final source tree in a separate index, without committing
          # workflow changes through GITHUB_TOKEN.
          cp .git/index /tmp/native-ports-check-index
          export GIT_INDEX_FILE=/tmp/native-ports-check-index
          git update-index --force-remove .github/workflows/materialize-native-ports.yml
          git update-index --add --cacheinfo 100644,c4aeb49e29fc53bb2a7fa8dfc37683fc5139f3e2,.github/workflows/native-ports.yml
          test "$(git write-tree)" = 2279de8500e937957245a9f4e6ffaef6b4a84740
          unset GIT_INDEX_FILE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add independent Go TypeScript and Swift libraries and conformance qualification'
          git push origin HEAD:codex/native-go-typescript-swift
